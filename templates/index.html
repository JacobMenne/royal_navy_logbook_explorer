<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Navy Logbook Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 840px;
      margin: 2rem auto;
      padding: 0 1.25rem 3rem;
      color: #24170a;
      background: #cba052;
      line-height: 1.55;
    }
    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      color: #1f1307;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid #8c6829;
      padding-bottom: 0.75rem;
      margin-bottom: 1.25rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.75rem; letter-spacing: 0.01em; }
    .nav-tabs { display: flex; gap: 0.5rem; }
    .nav-tab {
      background: #e6c887;
      color: #3b2510;
      border: 1px solid #8c6829;
      padding: 0.45rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
    }
    .nav-tab:hover:not(.active) { background: #efd7a1; }
    .nav-tab.active {
      background: #3b2510;
      color: #fdf7e7;
      border-color: #3b2510;
    }
    .subtitle { color: #3b2510; margin-top: 0; margin-bottom: 1.15rem; font-size: 0.95rem; font-weight: 500; }
    .source-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .toggle-btn {
      flex: 1;
      background: #e6c887;
      color: #3b2510;
      border: 1px solid #8c6829;
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
    }
    .toggle-btn:hover:not(.active) { background: #efd7a1; }
    .toggle-btn.active {
      background: #3b2510;
      color: #fdf7e7;
      border-color: #3b2510;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      background: #f7ecd2;
      padding: 1rem;
      border: 1px solid #8c6829;
      border-radius: 6px;
      align-items: center;
      box-shadow: 0 2px 6px rgba(36, 23, 10, 0.18);
    }
    select {
      flex: 1;
      padding: 0.55rem;
      font-size: 0.95rem;
      color: #24170a;
      background: #fdf7e7;
      border: 1px solid #a67f38;
      border-radius: 4px;
    }
    button {
      padding: 0.55rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid #3b2510;
      border-radius: 4px;
      background: #3b2510;
      color: #fdf7e7;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #543618; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary {
      background: #fdf7e7;
      color: #3b2510;
      border-color: #8c6829;
    }
    button.secondary:hover:not(:disabled) { background: #f0dfb8; }
    .card {
      margin-top: 1.35rem;
      background: #f7ecd2;
      border: 1px solid #8c6829;
      border-radius: 6px;
      padding: 1.35rem;
      box-shadow: 0 2px 8px rgba(36, 23, 10, 0.18);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #c9a661;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }
    .score-badge {
      font-family: Georgia, serif;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 0.3rem 0.75rem;
      border-radius: 4px;
      background: #e6c887;
      color: #2e1c0c;
      border: 1px solid #8c6829;
      white-space: nowrap;
    }
    .score-high { background: #e6b3a3; color: #6e160c; border-color: #b56c57; }
    .score-med { background: #f2cf7e; color: #5e3904; border-color: #b88c32; }
    .score-low { background: #e8d4a2; color: #47331a; border-color: #a6884b; }
    .meta { color: #5c4022; font-size: 0.9rem; }
    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid #c9a661;
      flex-wrap: wrap;
    }
    .flagged-item {
      border-left: 3px solid #754c19;
      background: #fdf7e7;
      padding: 0.65rem 0.9rem;
      margin-bottom: 0.75rem;
      border-radius: 0 4px 4px 0;
      font-size: 0.92rem;
    }
    .narrative-box {
      background: #fdf7e7;
      border: 1px solid #c9a661;
      border-left: 4px solid #754c19;
      border-radius: 0 6px 6px 0;
      padding: 1rem 1.25rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.95rem;
      line-height: 1.65;
    }
    .narrative-box h4 {
      margin: 1rem 0 0.4rem;
      font-size: 1.08rem;
      color: #2e1c0c;
      border-bottom: 1px solid #e3cfa3;
      padding-bottom: 0.2rem;
    }
    .narrative-box h4:first-child { margin-top: 0; }
    .narrative-box p { margin: 0.5rem 0; }
    .narrative-box ul { margin: 0.4rem 0 0.75rem; padding-left: 1.25rem; }
    .narrative-box li { margin-bottom: 0.35rem; }
    .narrative-box hr { border: none; border-top: 1px solid #e3cfa3; margin: 0.9rem 0; }
    #routeMap {
      height: 440px;
      width: 100%;
      border: 2px solid #8c6829;
      border-radius: 6px;
      margin-top: 0.5rem;
    }
    .map-legend {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: #3b2510;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 0.3rem;
      vertical-align: middle;
      border: 1.5px solid #24170a;
    }
    .pin-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #fdf7e7;
      border: 2px solid #24170a;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }
    .pin-start { background: #266b3a; }
    .pin-end { background: #8f1d14; }
    .kw {
      display: inline-block;
      background: #ebd094;
      border: 1px solid #b58f43;
      color: #2e1c0c;
      border-radius: 3px;
      padding: 0.05rem 0.4rem;
      font-size: 0.78rem;
      margin-right: 0.25rem;
      margin-top: 0.25rem;
    }
    details.transcription { margin-top: 0.5rem; }
    details.transcription summary {
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: #543618;
    }
    details.transcription pre {
      white-space: pre-wrap;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.88rem;
      background: #f7ecd2;
      border: 1px solid #c9a661;
      padding: 0.75rem;
      border-radius: 4px;
      margin-top: 0.4rem;
      line-height: 1.5;
    }
    .library-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fdf7e7;
      border: 1px solid #c9a661;
      border-radius: 5px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.6rem;
      cursor: pointer;
    }
    .library-row:hover { background: #f0dfb8; }
    .filter-pills { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    #status { margin-top: 0.75rem; font-size: 0.9rem; color: #2e1c0c; font-weight: 500; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>Royal Navy Logbook Explorer</h1>
    <div class="nav-tabs">
      <button id="tabExplorer" class="nav-tab active">Explorer</button>
      <button id="tabLibrary" class="nav-tab">Saved &amp; Scanned</button>
    </div>
  </div>

  <!-- EXPLORER VIEW -->
  <div id="explorerView">
    <p class="subtitle">Select a vessel to inspect or scan its logbooks (1756–1815).</p>

    <div class="source-toggle">
      <button id="btnStructured" class="toggle-btn active">CLIWOC Archive (Structured)</button>
      <button id="btnRawScan" class="toggle-btn">Handwritten Scans (Vision-LLM)</button>
    </div>

    <div class="controls">
      <select id="shipSelect">
        <option value="">-- Select a Ship --</option>
      </select>
      <button id="scanBtn" disabled>Scan Logbooks</button>
    </div>
    <div id="status"></div>

    <div id="dossier" class="card" style="display: none;">
      <div class="header-row">
        <div>
          <h2 id="shipTitle" style="margin:0;"></h2>
          <div id="shipMeta" class="meta"></div>
        </div>
        <div id="scoreBadge" class="score-badge">Not Scanned</div>
      </div>

      <h3>Voyage Summary</h3>
      <p id="shipSummary" style="white-space: pre-line;"></p>

      <h3>Scanned Pages</h3>
      <div id="flaggedList"></div>

      <div class="actions">
        <button id="saveBtn" class="secondary" style="display: none;">Save Voyage</button>
        <button id="deepDiveBtn" style="display: none;">Deep Dive (Voyage Narrative)</button>
        <button id="mapBtn" class="secondary" style="display: none;">Visualize Route</button>
      </div>

      <div id="deepDiveSection" style="display: none; margin-top: 1.5rem;">
        <h3>Deep Dive Narrative</h3>
        <div id="deepDiveText" class="narrative-box"></div>
      </div>

      <div id="mapSection" style="display: none; margin-top: 1.5rem;">
        <h3>Voyage Route Map</h3>
        <div id="mapStatus" class="meta"></div>
        <div id="routeMap"></div>
      </div>
    </div>
  </div>

  <!-- SAVED & SCANNED LIBRARY VIEW -->
  <div id="libraryView" style="display: none;">
    <div class="card" style="margin-top: 0;">
      <div class="header-row">
        <h2 style="margin:0;">Saved &amp; Scanned Logbooks</h2>
        <div class="filter-pills">
          <button id="filterSaved" class="nav-tab active">Saved ★</button>
          <button id="filterAllScanned" class="nav-tab">All Scanned</button>
        </div>
      </div>
      <div id="libraryList"></div>
    </div>
  </div>

  <script>
    const explorerView = document.getElementById("explorerView");
    const libraryView = document.getElementById("libraryView");
    const tabExplorer = document.getElementById("tabExplorer");
    const tabLibrary = document.getElementById("tabLibrary");
    const filterSaved = document.getElementById("filterSaved");
    const filterAllScanned = document.getElementById("filterAllScanned");
    const libraryList = document.getElementById("libraryList");

    const shipSelect = document.getElementById("shipSelect");
    const scanBtn = document.getElementById("scanBtn");
    const statusEl = document.getElementById("status");
    const dossier = document.getElementById("dossier");
    const saveBtn = document.getElementById("saveBtn");
    const deepDiveBtn = document.getElementById("deepDiveBtn");
    const mapBtn = document.getElementById("mapBtn");
    const mapSection = document.getElementById("mapSection");
    const mapStatus = document.getElementById("mapStatus");
    const btnStructured = document.getElementById("btnStructured");
    const btnRawScan = document.getElementById("btnRawScan");

    let currentShipId = null;
    let currentSource = "structured";
    let libraryMode = "saved";
    let libraryCache = [];
    let leafletMap = null;

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatMarkdown(md) {
      const lines = escapeHtml(md).split("\n");
      let html = "";
      let inList = false;

      const inlineFmt = s => s
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>");

      for (const raw of lines) {
        const line = raw.trim();
        if (!line) {
          if (inList) { html += "</ul>"; inList = false; }
          continue;
        }
        if (line === "---") {
          if (inList) { html += "</ul>"; inList = false; }
          html += "<hr/>";
        } else if (line.startsWith("### ")) {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<h4>${inlineFmt(line.slice(4))}</h4>`;
        } else if (line.startsWith("- ") || line.startsWith("* ")) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${inlineFmt(line.slice(2))}</li>`;
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<p>${inlineFmt(line)}</p>`;
        }
      }
      if (inList) html += "</ul>";
      return html;
    }

    function showView(view) {
      const isExplorer = view === "explorer";
      explorerView.style.display = isExplorer ? "block" : "none";
      libraryView.style.display = isExplorer ? "none" : "block";
      tabExplorer.classList.toggle("active", isExplorer);
      tabLibrary.classList.toggle("active", !isExplorer);
      if (!isExplorer) loadLibrary();
    }

    async function loadLibrary() {
      const res = await fetch("/api/library");
      libraryCache = await res.json();
      renderLibrary();
    }

    function renderLibrary() {
      const items = libraryMode === "saved"
        ? libraryCache.filter(s => s.is_saved)
        : libraryCache;

      if (!items.length) {
        libraryList.innerHTML = `<p class="meta">No ${libraryMode === "saved" ? "saved" : "scanned"} logbooks yet.</p>`;
        return;
      }

      libraryList.innerHTML = items.map(s => `
        <div class="library-row" onclick="openFromLibrary(${s.id}, '${s.source_type}')">
          <div>
            <strong>${escapeHtml(s.ship_name)}</strong> ${s.is_saved ? "★" : ""}<br/>
            <span class="meta">${escapeHtml(s.ship_class || "Unknown")} • ${s.year_start}–${s.year_end} • ${s.source_type}</span>
          </div>
          <div class="score-badge">${s.interest_score !== null ? s.interest_score + " / 10" : "Not Scanned"}</div>
        </div>
      `).join("");
    }

    async function openFromLibrary(shipId, sourceType) {
      showView("explorer");
      if (currentSource !== sourceType) {
        currentSource = sourceType;
        btnStructured.classList.toggle("active", sourceType === "structured");
        btnRawScan.classList.toggle("active", sourceType === "raw_scan");
        await loadShips();
      }
      shipSelect.value = shipId;
      currentShipId = String(shipId);
      scanBtn.disabled = false;
      const res = await fetch(`/api/ships/${shipId}`);
      renderDossier(await res.json());
    }

    async function loadShips() {
      const res = await fetch(`/api/ships?source_type=${currentSource}`);
      const ships = await res.json();
      shipSelect.innerHTML = '<option value="">-- Select a Ship --</option>';
      ships.forEach(s => {
        const score = s.interest_score !== null ? `[${s.interest_score}/10] ` : "";
        const saved = s.is_saved ? " ★" : "";
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = `${score}${s.ship_name} (${s.year_start}–${s.year_end} | ${s.ship_class || "Unknown"})${saved}`;
        shipSelect.appendChild(opt);
      });
    }

    function setSource(source) {
      currentSource = source;
      btnStructured.classList.toggle("active", source === "structured");
      btnRawScan.classList.toggle("active", source === "raw_scan");
      currentShipId = null;
      scanBtn.disabled = true;
      dossier.style.display = "none";
      mapSection.style.display = "none";
      statusEl.textContent = "";
      loadShips();
    }

    function renderDossier(data) {
      const { ship, flagged_pages } = data;
      const isScanned = ship.interest_score !== null;

      dossier.style.display = "block";
      mapSection.style.display = "none";
      document.getElementById("shipTitle").textContent = ship.ship_name;
      document.getElementById("shipMeta").textContent =
        `${ship.ship_class || "Unknown Class"} • ${ship.year_start}–${ship.year_end} • Source: ${ship.source_type}`;

      const badge = document.getElementById("scoreBadge");
      badge.className = "score-badge";
      if (isScanned) {
        badge.textContent = `${ship.interest_score} / 10`;
        if (ship.interest_score >= 7) badge.classList.add("score-high");
        else if (ship.interest_score >= 4) badge.classList.add("score-med");
        else badge.classList.add("score-low");
      } else {
        badge.textContent = "Not Scanned";
      }

      document.getElementById("shipSummary").textContent =
        ship.triage_summary || "No logbook scan summary yet.";

      const deepDiveSection = document.getElementById("deepDiveSection");
      const deepDiveText = document.getElementById("deepDiveText");
      if (ship.deep_dive_narrative) {
        deepDiveSection.style.display = "block";
        deepDiveText.innerHTML = formatMarkdown(ship.deep_dive_narrative);
      } else {
        deepDiveSection.style.display = "none";
        deepDiveText.innerHTML = "";
      }

      const flaggedList = document.getElementById("flaggedList");
      if (!flagged_pages.length) {
        flaggedList.innerHTML = "<p class='meta'>No pages scanned yet.</p>";
      } else {
        flaggedList.innerHTML = flagged_pages.map(p => `
          <div class="flagged-item">
            <strong>Page ${p.page_num}</strong> (${escapeHtml(p.date_range)}) — Score: ${p.page_score} / 10<br/>
            ${escapeHtml(p.remarks_summary)}<br/>
            ${p.flagged_keywords.map(k => `<span class="kw">${escapeHtml(k)}</span>`).join("")}
            <details class="transcription">
              <summary>Read Full Transcription</summary>
              <pre>${escapeHtml(p.full_transcription || "No transcription recorded.")}</pre>
            </details>
          </div>
        `).join("");
      }

      if (isScanned && ship.source_type === "raw_scan") {
        saveBtn.style.display = "inline-block";
        saveBtn.textContent = ship.is_saved ? "Saved ★" : "Save Voyage";
        saveBtn.disabled = Boolean(ship.is_saved);
      } else {
        saveBtn.style.display = "none";
      }

      if (isScanned) {
        deepDiveBtn.style.display = "inline-block";
        deepDiveBtn.textContent = ship.deep_dive_narrative
          ? "Regenerate Deep Dive"
          : "Deep Dive (Voyage Narrative)";
        mapBtn.style.display = "inline-block";
        mapBtn.disabled = false;
      } else {
        deepDiveBtn.style.display = "none";
        mapBtn.style.display = "none";
      }
    }

    function renderRouteMap(waypoints) {
      mapSection.style.display = "block";
      if (!waypoints.length) {
        mapStatus.innerHTML = "No geographical coordinates or landmarks found for this voyage.";
        return;
      }

      mapStatus.innerHTML = `
        Plotted ${waypoints.length} waypoints. Click any pin for date and log details.
        <div class="map-legend">
          <span><span class="legend-dot" style="background:#266b3a;"></span>Start of Voyage</span>
          <span><span class="legend-dot" style="background:#8f1d14;"></span>End of Voyage</span>
          <span><span class="legend-dot" style="background:#b53324;"></span>Notable Event</span>
          <span><span class="legend-dot" style="background:#cba052;"></span>Daily Position</span>
        </div>
      `;

      if (leafletMap) {
        leafletMap.remove();
        leafletMap = null;
      }

      leafletMap = L.map("routeMap");
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 18
      }).addTo(leafletMap);

      const coords = waypoints.map(w => [w.lat, w.lon]);
      const routeLine = L.polyline(coords, {
        color: "#6e160c",
        weight: 3,
        dashArray: "6, 6"
      }).addTo(leafletMap);

      const startIcon = L.divIcon({
        className: "",
        html: '<div class="pin-badge pin-start" style="padding:2px 7px;">START</div>',
        iconSize: [52, 22],
        iconAnchor: [26, 11]
      });

      const endIcon = L.divIcon({
        className: "",
        html: '<div class="pin-badge pin-end" style="padding:2px 7px;">END</div>',
        iconSize: [42, 22],
        iconAnchor: [21, 11]
      });

      waypoints.forEach((w, idx) => {
        const isStart = idx === 0;
        const isEnd = idx === waypoints.length - 1 && waypoints.length > 1;
        let marker;
        let labelPrefix = "";

        if (isStart) {
          marker = L.marker([w.lat, w.lon], { icon: startIcon, zIndexOffset: 1000 });
          labelPrefix = "START OF VOYAGE — ";
        } else if (isEnd) {
          marker = L.marker([w.lat, w.lon], { icon: endIcon, zIndexOffset: 900 });
          labelPrefix = "END OF VOYAGE — ";
        } else if (w.is_event) {
          marker = L.circleMarker([w.lat, w.lon], {
            radius: 6,
            color: "#24170a",
            fillColor: "#b53324",
            fillOpacity: 0.9,
            weight: 2
          });
        } else {
          marker = L.circleMarker([w.lat, w.lon], {
            radius: 3.5,
            color: "#543618",
            fillColor: "#cba052",
            fillOpacity: 0.85,
            weight: 1
          });
        }

        marker.addTo(leafletMap).bindPopup(
          `<strong>${labelPrefix}${escapeHtml(w.place_name)}</strong><br/>` +
          `<em>${escapeHtml(w.date)}</em><br/>` +
          `${escapeHtml(w.summary)}`
        );
      });

      leafletMap.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
      mapSection.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    tabExplorer.addEventListener("click", () => showView("explorer"));
    tabLibrary.addEventListener("click", () => showView("library"));
    filterSaved.addEventListener("click", () => {
      libraryMode = "saved";
      filterSaved.classList.add("active");
      filterAllScanned.classList.remove("active");
      renderLibrary();
    });
    filterAllScanned.addEventListener("click", () => {
      libraryMode = "all";
      filterAllScanned.classList.add("active");
      filterSaved.classList.remove("active");
      renderLibrary();
    });

    btnStructured.addEventListener("click", () => setSource("structured"));
    btnRawScan.addEventListener("click", () => setSource("raw_scan"));

    shipSelect.addEventListener("change", async () => {
      currentShipId = shipSelect.value;
      scanBtn.disabled = !currentShipId;
      statusEl.textContent = "";
      if (!currentShipId) {
        dossier.style.display = "none";
        return;
      }
      const res = await fetch(`/api/ships/${currentShipId}`);
      renderDossier(await res.json());
    });

    scanBtn.addEventListener("click", async () => {
      if (!currentShipId) return;
      scanBtn.disabled = true;
      statusEl.textContent = "Scanning logbooks... watch PowerShell for live page progress.";
      try {
        const res = await fetch(`/api/ships/${currentShipId}/triage`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = `Error: ${data.error}`;
        } else {
          statusEl.textContent = "Scan complete.";
          renderDossier(data);
          await loadShips();
          shipSelect.value = currentShipId;
        }
      } catch (err) {
        statusEl.textContent = `Request failed: ${err.message}. Check PowerShell for details.`;
      }
      scanBtn.disabled = false;
    });

    saveBtn.addEventListener("click", async () => {
      if (!currentShipId) return;
      await fetch(`/api/ships/${currentShipId}/save`, { method: "POST" });
      saveBtn.textContent = "Saved ★";
      saveBtn.disabled = true;
      await loadShips();
      shipSelect.value = currentShipId;
    });

    deepDiveBtn.addEventListener("click", async () => {
      if (!currentShipId) return;
      deepDiveBtn.disabled = true;
      statusEl.textContent = "Generating Deep Dive narrative...";
      try {
        const res = await fetch(`/api/ships/${currentShipId}/deep-dive`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = `Error: ${data.error}`;
        } else {
          statusEl.textContent = "Deep Dive complete.";
          renderDossier(data);
          document.getElementById("deepDiveSection").scrollIntoView({ behavior: "smooth" });
        }
      } catch (err) {
        statusEl.textContent = `Request failed: ${err.message}`;
      }
      deepDiveBtn.disabled = false;
    });

    mapBtn.addEventListener("click", async () => {
      if (!currentShipId) return;
      mapBtn.disabled = true;
      statusEl.textContent = "Loading voyage route...";
      try {
        const res = await fetch(`/api/ships/${currentShipId}/route`);
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = `Error: ${data.error}`;
        } else {
          statusEl.textContent = "Route loaded.";
          renderRouteMap(data.waypoints || []);
        }
      } catch (err) {
        statusEl.textContent = `Request failed: ${err.message}`;
      }
      mapBtn.disabled = false;
    });

    window.addEventListener("pagehide", () => {
      navigator.sendBeacon("/api/shutdown");
    });

    loadShips();
  </script>
</body>
</html>
